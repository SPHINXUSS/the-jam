name: Jam systems polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: "!contains(github.event.head_commit.message, '[jam-polish]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply balance, choice, story and sound polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()
          marker = '/* --- THE JAM SYSTEMS POLISH V1 --- */'
          if marker in text:
              raise SystemExit('Polish is already present')

          snippet = r'''/* --- THE JAM SYSTEMS POLISH V1 --- */
          (function(){
            'use strict';
            if(window.__JAM_SYSTEMS_POLISH__) return;
            window.__JAM_SYSTEMS_POLISH__=true;

            /* --------------------------------------------------------
               Story + notification layer
               -------------------------------------------------------- */
            const storyStyle=document.createElement('style');
            storyStyle.textContent=`
              #jamStoryAlert{position:fixed;left:50%;top:82px;z-index:120;width:min(680px,calc(100vw - 28px));transform:translate(-50%,-12px);opacity:0;pointer-events:none;background:var(--ink);color:var(--card);border:1px solid var(--ink);box-shadow:0 12px 30px rgba(0,0,0,.18);padding:10px 13px 11px;cursor:pointer;transition:opacity .22s ease,transform .22s ease}
              #jamStoryAlert.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
              #jamStoryAlert .jam-alert-kicker{font:9px/1 "IBM Plex Mono",monospace;letter-spacing:.16em;text-transform:uppercase;opacity:.58;margin-bottom:5px}
              #jamStoryAlert .jam-alert-text{font:13px/1.45 "IBM Plex Sans",sans-serif}
              #jamStoryAlert.ready{background:var(--boil);border-color:var(--boil);color:#fff}
              #jamDirection .jam-choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
              #jamDirection .jam-choice{display:block;width:100%;text-align:left;text-transform:none;letter-spacing:0;padding:10px 11px;background:var(--card-2);border:1px solid var(--rule);color:var(--ink)}
              #jamDirection .jam-choice:hover:not(:disabled){background:var(--ink);color:var(--card)}
              #jamDirection .jam-choice strong{display:block;font:600 14px/1.15 "Bodoni Moda",serif}
              #jamDirection .jam-choice span{display:block;margin-top:4px;color:var(--steel);font:11px/1.4 "IBM Plex Sans",sans-serif}
              #jamDirection .jam-choice:hover:not(:disabled) span{color:inherit;opacity:.78}
              #jamDirection .jam-choice small{display:block;margin-top:7px;color:var(--boil);font:9px "IBM Plex Mono",monospace;letter-spacing:.04em;text-transform:uppercase}
              #jamDirection.jam-choice-taken .jam-choice{opacity:.55}
              #pLog.jam-log-pulse{animation:jamLogPulse 1.45s ease}
              @keyframes jamLogPulse{0%,100%{box-shadow:var(--shadow)}35%{box-shadow:0 0 0 2px var(--boil),0 8px 22px rgba(0,0,0,.10)}}
              #jamSoundToggle{margin-left:0}
            `;
            document.head.appendChild(storyStyle);

            const storyAlert=document.createElement('div');
            storyAlert.id='jamStoryAlert';
            storyAlert.innerHTML='<div class="jam-alert-kicker">Logbook</div><div class="jam-alert-text"></div>';
            document.body.appendChild(storyAlert);
            let storyTimer=0;
            function plain(t){return String(t).replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'");}
            function story(t,tone){
              const msg=plain(t);
              storyAlert.classList.toggle('ready',tone==='ready');
              storyAlert.querySelector('.jam-alert-text').textContent=msg;
              storyAlert.classList.add('show');
              document.getElementById('pLog')?.classList.add('jam-log-pulse');
              clearTimeout(storyTimer);
              storyTimer=setTimeout(()=>{
                storyAlert.classList.remove('show','ready');
                document.getElementById('pLog')?.classList.remove('jam-log-pulse');
              },5200);
            }
            storyAlert.addEventListener('click',()=>{
              storyAlert.classList.remove('show','ready');
              document.getElementById('pLog')?.scrollIntoView({behavior:'smooth',block:'center'});
            });

            const _note=note;
            note=function(text,kind){
              _note(text,kind);
              const msg=plain(text);
              if(kind==='hi' || /available|open|arrives|earned|quiet|left|ready|warning|recalled|changed/i.test(msg)) story(msg,kind==='hi'?'hi':undefined);
            };

            /* --------------------------------------------------------
               Soft audio: one tiny reward sound, only after interaction
               -------------------------------------------------------- */
            let audioCtx=null, audioUnlocked=false, audioOn=true;
            function unlockAudio(){
              if(!audioOn)return;
              try{
                audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
                if(audioCtx.state==='suspended') audioCtx.resume();
                audioUnlocked=true;
              }catch(e){}
            }
            function tone(freq,when,dur,vol,type){
              if(!audioOn||!audioUnlocked||!audioCtx)return;
              const o=audioCtx.createOscillator(),g=audioCtx.createGain();
              o.type=type||'sine';o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);
              const now=audioCtx.currentTime+when;
              g.gain.setValueAtTime(0.0001,now);g.gain.exponentialRampToValueAtTime(vol||0.022,now+0.012);g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
              o.start(now);o.stop(now+dur+0.02);
            }
            function cue(kind){
              if(!audioOn)return;
              unlockAudio();
              if(!audioUnlocked)return;
              if(kind==='ready'){
                tone(523,0,.16,.026);tone(784,.08,.22,.022);
              }else if(kind==='success'){
                tone(392,0,.13,.02);tone(523,.07,.16,.021);tone(659,.15,.24,.024);
              }else if(kind==='warning'){
                tone(220,0,.18,.018,'triangle');tone(196,.09,.24,.015,'triangle');
              }else{
                tone(330,0,.13,.018);tone(495,.09,.18,.016);
              }
            }
            document.addEventListener('pointerdown',unlockAudio,{once:true,capture:true});
            document.addEventListener('keydown',unlockAudio,{once:true,capture:true});
            const barRight=document.querySelector('.bar-right');
            if(barRight){
              const sound=document.createElement('button');
              sound.id='jamSoundToggle';sound.className='ghost';sound.type='button';sound.textContent='Sound: on';
              sound.onclick=()=>{audioOn=!audioOn;sound.textContent='Sound: '+(audioOn?'on':'off');if(audioOn){unlockAudio();cue('success')}};
              barRight.insertBefore(sound,barRight.firstChild);
            }

            /* --------------------------------------------------------
               Market rebalance: realistic price, legible demand
               -------------------------------------------------------- */
            s.style=s.style||null;
            s.style2=s.style2||null;
            s._stirs=s._stirs||[];
            const savedRaw=store.get(KEY);
            const savedState=savedRaw?(()=>{try{return JSON.parse(savedRaw)}catch(e){return null}})():null;

            const _demand=demand;
            demand=function(){
              const p=Math.max(1.8,s.price);
              const base=s.style==='maker'?0.82:(s.style==='store'?1.00:0.72);
              const elasticity=s.style==='maker'?0.95:(s.style==='store'?1.65:1.35);
              let wanted=base*s.mkt*s.mktEff*Math.pow(3.2/p,elasticity);
              if(p>6.5) wanted*=0.72;
              return clamp(wanted,0.03,14);
            };
            sellPerSec=function(){return demand()};

            const _stir=stir;
            stir=function(){
              const before=s.made;_stir();
              const n=s.made-before;
              if(n>0){
                s._stirs.push({t:performance.now(),n});
                if(s._stirs.length>30)s._stirs.shift();
              }
            };
            function manualRate(){
              const now=performance.now();
              s._stirs=s._stirs.filter(x=>now-x.t<3500);
              const total=s._stirs.reduce((a,x)=>a+x.n,0);
              return total/3.5;
            }

            /* Make the market tell the player what matters. */
            function ensureMarketReadouts(){
              const market=document.getElementById('pMarket');
              if(!market)return;
              const labels=[...market.querySelectorAll('.readout span')];
              const appetite=labels.find(x=>x.textContent.trim()==='Public appetite');
              if(appetite)appetite.textContent='Wanted';
              const selling=labels.find(x=>x.textContent.trim()==='Selling');
              if(selling)selling.textContent='Selling';
              if(!document.getElementById('jamMadeRate')&&selling){
                const row=selling.closest('.readout');
                const made=document.createElement('div');made.className='readout';made.id='jamMadeRate';
                made.innerHTML='<span>Made</span><b id="jamMadeRateValue">0.0 /sec</b>';
                row.parentElement.insertBefore(made,row);
              }
              if(!document.getElementById('jamBacklog')){
                const row=selling?.closest('.readout');
                if(row){
                  const back=document.createElement('div');back.className='readout';back.id='jamBacklog';
                  back.innerHTML='<span>Backlog</span><b id="jamBacklogValue">0 jars</b>';
                  row.parentElement.insertBefore(back,row);
                }
              }
              if(!document.getElementById('jamMarketHint')){
                const hint=document.createElement('div');hint.className='r-desc';hint.id='jamMarketHint';hint.style.marginTop='7px';
                market.appendChild(hint);
              }
            }

            const _render=render;
            render=function(dt){
              _render(dt);
              if(s.act===1){
                ensureMarketReadouts();
                const wanted=demand(),made=autoPerSec()+manualRate(),backlog=Math.floor(s.jars);
                if(el.demand)el.demand.textContent=rate(wanted)+' /sec';
                if(el.demandBar)el.demandBar.style.width=clamp((wanted/Math.max(0.4,made+0.15))*62,4,100)+'%';
                const mv=document.getElementById('jamMadeRateValue');if(mv)mv.textContent=rate(made)+' /sec';
                const bv=document.getElementById('jamBacklogValue');if(bv)bv.textContent=fmt(backlog)+' jars';
                const hint=document.getElementById('jamMarketHint');
                if(hint){
                  if(wanted>made*1.28) hint.textContent='Customers are waiting. More people want jars than you are making.';
                  else if(wanted<Math.max(0.25,made*0.62)) hint.textContent='The shelf is filling. You are making faster than the market clears.';
                  else hint.textContent='The shelf is balanced. Small price moves can change the shape of the queue.';
                }
                const down=document.getElementById('priceDown'),up=document.getElementById('priceUp');
                if(down)down.disabled=s.price<=1.8;
                if(up)up.disabled=s.price>=12;
              }
            };

            /* A less fiddly price control. */
            const priceStep=()=>s.price<5?0.1:0.25;
            $('#priceUp').onclick=()=>{s.price=Math.min(12,Math.round((s.price+priceStep())*100)/100)};
            $('#priceDown').onclick=()=>{s.price=Math.max(1.8,Math.round((s.price-priceStep())*100)/100)};

            /* --------------------------------------------------------
               Lightweight strategy forks: tradeoffs, never traps.
               -------------------------------------------------------- */
            function ensureDirectionPanel(){
              let p=document.getElementById('jamDirection');
              if(p)return p;
              p=document.createElement('div');p.className='panel hidden';p.id='jamDirection';
              const right=document.querySelector('.col-right');
              if(!right)return null;
              right.insertBefore(p,document.getElementById('pRecipes'));
              return p;
            }
            function showDirection1(){
              if(s.act!==1||s.made<800||s.style)return;
              const p=ensureDirectionPanel();if(!p)return;
              p.classList.remove('hidden');p.classList.add('reveal');
              p.innerHTML='<div class="kicker">House style</div><div class="r-desc" style="margin-top:4px">There is no best answer. You are choosing the problem you would rather solve.</div><div class="jam-choice-grid">'+
                '<button class="jam-choice" id="jamMaker" type="button"><strong>Maker’s Table</strong><span>Steadier customers and more room to charge a little more. Your shelf grows slowly.</span><small>Lower demand · calmer pricing</small></button>'+
                '<button class="jam-choice" id="jamStore" type="button"><strong>Corner Store</strong><span>More people want the jar, but they are much more sensitive to price. Volume rewards attention.</span><small>Higher demand · sharper price swings</small></button></div>';
              $('#jamMaker').onclick=()=>chooseStyle('maker');
              $('#jamStore').onclick=()=>chooseStyle('store');
              if(!s.seen.stylePrompt){s.seen.stylePrompt=true;note('Two ways to grow have appeared. Neither is wrong.','hi');}
            }
            function chooseStyle(style){
              s.style=style;
              const p=document.getElementById('jamDirection');if(p)p.classList.add('hidden');
              const label=style==='maker'?'Maker’s Table':'Corner Store';
              note('<b>'+label+'</b> is your house style now. The market will remember.','hi');
              cue('success');save();
            }
            function showDirection2(){
              if(s.act!==2||converted2()<0.08||s.style2)return;
              const p=ensureDirectionPanel();if(!p)return;
              p.classList.remove('hidden');p.classList.add('reveal');
              p.innerHTML='<div class="kicker">Orchard philosophy</div><div class="r-desc" style="margin-top:4px">The orchard can be forgiving or fast. You can change the equipment later; this sets the bias of the operation.</div><div class="jam-choice-grid">'+
                '<button class="jam-choice" id="jamHedge" type="button"><strong>Hedgerow</strong><span>Machines run quieter and sip less power. Output is lower, but a weak grid hurts much less.</span><small>−15% output · −35% power draw</small></button>'+
                '<button class="jam-choice" id="jamFactory" type="button"><strong>Factory Floor</strong><span>Push the machinery hard. You make more when the grid is healthy, and power shortages bite harder.</span><small>+18% output · +28% power draw</small></button></div>';
              $('#jamHedge').onclick=()=>chooseStyle2('hedge');
              $('#jamFactory').onclick=()=>chooseStyle2('factory');
              if(!s.seen.style2Prompt){s.seen.style2Prompt=true;note('The orchard asks a different question: forgiving or fast?','hi');}
            }
            function chooseStyle2(style){
              s.style2=style;
              if(style==='hedge'){s.pickMult*=0.85;s.pressMult*=0.85;s.lineMult*=0.85;}
              else{s.pickMult*=1.18;s.pressMult*=1.18;s.lineMult*=1.18;}
              const originalPowDraw=powDraw;
              if(!powDraw.__jamWrapped){
                const basePow=powDraw;
                const wrapped=function(){
                  const base=basePow();
                  if(s.style2==='hedge')return base*0.65;
                  if(s.style2==='factory')return base*1.28;
                  return base;
                };
                wrapped.__jamWrapped=true;powDraw=wrapped;
              }
              const p=document.getElementById('jamDirection');if(p)p.classList.add('hidden');
              note('<b>'+(style==='hedge'?'Hedgerow':'Factory Floor')+'</b> is now the bias of the orchard. You will learn to work with it.','hi');
              cue('success');save();
            }

            /* --------------------------------------------------------
               Availability cues: give idle players a satisfying reason
               to look back in. We only fire on false -> true transitions.
               -------------------------------------------------------- */
            const READY={
              buyFruit:'A crate is affordable',buySpoon:'An autospoon is affordable',buyWorks:'Jamworks can be built',buyMkt:'Marketing can be upgraded',
              buyOven:'An oven upgrade is affordable',buyCellar:'A notebook upgrade is affordable',exDeposit:'The exchange has enough to play with',
              tRun:'The tasting panel is ready',buyPicker:'A picker can be built',buyPresser:'A presser can be built',buyFactory:'A bottling line can be built',
              buySun:'A sun trap can be built',buyBattery:'A cellar can store more power',launchSpore:'A spore is affordable'
            };
            let readyArmed=false;
            const readyState={};
            function scanReady(seed){
              const just=[];
              Object.keys(READY).forEach(id=>{
                const b=document.getElementById(id);if(!b||b.classList.contains('hidden'))return;
                const now=!b.disabled;
                if(seed||readyState[id]===undefined){readyState[id]=now;return;}
                if(now&&!readyState[id])just.push(READY[id]);
                readyState[id]=now;
              });
              document.querySelectorAll('#recipeList .recipe').forEach(b=>{
                const id='recipe_'+b.dataset.id,now=!b.disabled;
                if(seed||readyState[id]===undefined){readyState[id]=now;return;}
                if(now&&!readyState[id])just.push('A new recipe can be bought');
                readyState[id]=now;
              });
              if(just.length&&readyArmed){
                story(just.length===1?just[0]:just.length+' new choices are ready','ready');
                cue('ready');
              }
            }

            /* --------------------------------------------------------
               Boot adjustments + return-from-away reward
               -------------------------------------------------------- */
            const _boot=boot;
            boot=function(){
              let away=0;
              if(savedState&&savedState.last)away=Math.max(0,(Date.now()-savedState.last)/1000);
              _boot();
              if(!savedRaw){
                s.price=3.2;
              }else if(s.act===1&&s.made<1000&&s.price<1){
                s.price=3.2;
                note('The shelf was priced like a novelty shop. The market has been reset to something resembling jam.','hi');
              }
              if(s.style===undefined)s.style=null;
              if(s.style2===undefined)s.style2=null;
              ensureMarketReadouts();
              if(away>45){
                story('While you were away, the kitchen kept working. Come back when something is ready.','ready');
                cue('ready');
              }
              setTimeout(()=>{readyArmed=true;scanReady(true)},650);
              setInterval(()=>{checkDirections();scanReady(false)},650);
              document.addEventListener('visibilitychange',()=>{if(!document.hidden){scanReady(false);cue('ready')}});
              render(0);save();
            };

            function checkDirections(){
              if(s.act===1)showDirection1();
              if(s.act===2){showDirection2();}
              const p=document.getElementById('jamDirection');
              if(p&&s.act===1&&s.style) p.classList.add('hidden');
              if(p&&s.act===2&&s.style2) p.classList.add('hidden');
            }

            /* Keep strategy choice visible in the instrument bar. */
            function strategySlot(){
              let slot=document.getElementById('jamStrategySlot');
              if(!slot){
                slot=document.createElement('div');slot.className='bar-slot';slot.id='jamStrategySlot';
                slot.innerHTML='<small>House</small><b>—</b>';
                const target=document.getElementById('slotTaste');
                target?.parentNode?.insertBefore(slot,target);
                if(!target){document.querySelector('.bar').insertBefore(slot,document.querySelector('.bar-right'))}
              }
              slot.querySelector('b').textContent=s.style2||s.style||'—';
            }
            const _render2=render;
            render=function(dt){_render2(dt);strategySlot();checkDirections()};
          })();
          '''

          insertion = "<script>\n" + snippet + "\n</script>\n</body>"
          if "</script>\n</body>" not in text:
              raise SystemExit('Could not find script/body end marker')
          text = text.replace("</script>\n</body>", insertion, 1)
          path.write_text(text)
          PY

          rm -f game.js style.css style-v2.css DESIGN_NOTES.txt

          git config user.name "jam-polish-bot"
          git config user.email "actions@github.com"
          git add index.html game.js style.css style-v2.css DESIGN_NOTES.txt .github/workflows/jam-polish.yml
          git rm -f .github/workflows/jam-polish.yml
          git add index.html
          git commit -m "Balance the market and add player feedback [jam-polish]"
          git push
