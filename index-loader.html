<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Jam</title><style>html,body{margin:0;height:100%;background:#e4e7de;color:#1e1a22;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.loading{letter-spacing:.08em;text-transform:uppercase;font-size:12px;opacity:.6}</style></head><body><div class="loading">Opening the kitchen…</div><script>
(async()=>{
  try{
    const [app,polish]=await Promise.all([fetch('game.html').then(r=>r.text()),fetch('enhancements.js').then(r=>r.text())]);
    const injected=app.replace('</script>\n</body>','<script>\n'+polish+'\n</script>\n</body>');
    document.open();document.write(injected);document.close();
  }catch(e){document.body.innerHTML='<div class="loading">The kitchen could not be opened.<br><small>'+String(e)+'</small></div>'}
})();
</script></body></html>
